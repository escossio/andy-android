name: Governance CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  governance-tests:
    name: governance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test trusted governance
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch candidate objects only
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/guard-candidate"
          ACTUAL_HEAD_SHA="$(git rev-parse refs/remotes/origin/guard-candidate)"
          test "$ACTUAL_HEAD_SHA" = "$HEAD_SHA"
      - name: Scan trusted main
        if: github.event_name == 'push'
        run: python -I scripts/security/scan_secrets.py .
      - name: Scan candidate blobs with trusted scanner
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -I scripts/security/scan_secrets.py --git-ref "$HEAD_SHA"

  architecture-guard:
    name: architecture-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch candidate objects only
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/guard-candidate"
          ACTUAL_HEAD_SHA="$(git rev-parse refs/remotes/origin/guard-candidate)"
          test "$ACTUAL_HEAD_SHA" = "$HEAD_SHA"
      - name: Validate current policy on main push
        if: github.event_name == 'push'
        run: python -I scripts/architecture/check_guardrails.py --policy-self-check
      - name: Evaluate pull request against trusted base
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python -I scripts/architecture/check_guardrails.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --branch "$HEAD_BRANCH"

  android-instrumentation:
    name: android-instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact PR candidate for unprivileged instrumentation
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect device identity module
        id: device_identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f data/device-identity/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_NOT_PRESENT'
          fi

      - name: Install Android emulator dependencies
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"

      - name: Create and boot API 36 emulator
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name andy-ci-api36 \
            --package 'system-images;android-36;google_apis;x86_64'
          "$EMULATOR" \
            -avd andy-ci-api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/andy-emulator.log" 2>&1 &
          "$ADB" wait-for-device
          booted=''
          for attempt in $(seq 1 120); do
            booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$booted" == '1' ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$booted" != '1' ]]; then
            cat "$RUNNER_TEMP/andy-emulator.log"
            exit 1
          fi

      - name: Run real Android Keystore instrumentation tests
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :data:device-identity:connectedDebugAndroidTest

      - name: Stop emulator
        if: always() && steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -u
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/platform-tools/adb" emulator -kill || true

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact PR candidate for unprivileged build
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project
        id: android_project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./gradlew && -f ./settings.gradle.kts && -f ./app/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_PROJECT_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_PROJECT_NOT_PRESENT'
          fi

      - name: Install compile SDK and build tools
        if: steps.android_project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Build and test exact candidate
        if: steps.android_project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success() && steps.android_project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: andy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
