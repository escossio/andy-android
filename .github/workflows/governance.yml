name: Governance CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  governance-tests:
    name: governance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test trusted governance
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch candidate objects only
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/guard-candidate"
          ACTUAL_HEAD_SHA="$(git rev-parse refs/remotes/origin/guard-candidate)"
          test "$ACTUAL_HEAD_SHA" = "$HEAD_SHA"
      - name: Scan trusted main
        if: github.event_name == 'push'
        run: python -I scripts/security/scan_secrets.py .
      - name: Scan candidate blobs with trusted scanner
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -I scripts/security/scan_secrets.py --git-ref "$HEAD_SHA"

  architecture-guard:
    name: architecture-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch candidate objects only
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/guard-candidate"
          ACTUAL_HEAD_SHA="$(git rev-parse refs/remotes/origin/guard-candidate)"
          test "$ACTUAL_HEAD_SHA" = "$HEAD_SHA"
      - name: Validate current policy on main push
        if: github.event_name == 'push'
        run: python -I scripts/architecture/check_guardrails.py --policy-self-check
      - name: Evaluate pull request against trusted base
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python -I scripts/architecture/check_guardrails.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --branch "$HEAD_BRANCH"

  android-instrumentation:
    name: android-instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact PR candidate for unprivileged instrumentation
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect device identity module
        id: device_identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f data/device-identity/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_NOT_PRESENT'
          fi

      - name: Install Android emulator dependencies
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64'
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"

      - name: Verify KVM access and acceleration
        if: steps.device_identity.outputs.present == 'true'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          if ! test -e /dev/kvm; then
            echo 'KVM_DEVICE_MISSING'
            exit 1
          fi
          timeout -k 1s 10s id
          timeout -k 1s 10s id -nG
          timeout -k 1s 10s ls -l /dev/kvm
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            sudo chmod 0666 /dev/kvm
          fi
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            echo 'KVM_ACCESS_UNAVAILABLE'
            exit 1
          fi
          if ! timeout -k 1s 10s "$EMULATOR" -accel-check; then
            echo 'KVM_ACCEL_CHECK_FAILED'
            exit 1
          fi

      - name: Create and boot API 36 emulator
        if: steps.device_identity.outputs.present == 'true'
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          boot_diagnostics() {
            echo "=== emulator process ==="
            ps -p "${EMULATOR_PID:-$$}" -o pid,ppid,stat,args || true
            echo "=== adb devices ==="
            timeout -k 1s 10s "$ADB" devices -l || true
            echo "=== emulator log ==="
            timeout -k 1s 10s cat "$RUNNER_TEMP/andy-emulator.log" || true
            echo "=== host virtualization ==="
            test -e /dev/kvm && ls -l /dev/kvm || true
          }
          trap 'status=$?; if (( status != 0 )); then boot_diagnostics; fi' EXIT
          AVD_HOME="$RUNNER_TEMP/andy-avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          AVAILABLE_DEVICES="$(timeout -k 1s 10s "$AVDMANAGER" list device -c)"
          if grep -qx 'pixel' <<< "$AVAILABLE_DEVICES"; then
            DEVICE_ID='pixel'
          elif grep -qx 'pixel_xl' <<< "$AVAILABLE_DEVICES"; then
            DEVICE_ID='pixel_xl'
          else
            echo 'NO_SUPPORTED_AVD_DEVICE_DEFINITION'
            printf '%s\n' "$AVAILABLE_DEVICES"
            exit 1
          fi
          timeout -k 1s 60s "$AVDMANAGER" create avd \
            --force \
            --name andy-ci-api36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device "$DEVICE_ID"
          echo "HOME=$HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-UNSET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-UNSET}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-UNSET}"
          echo "ANDROID_EMULATOR_HOME=${ANDROID_EMULATOR_HOME:-UNSET}"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-UNSET}"
          echo "=== avdmanager detailed list ==="
          timeout -k 1s 10s "$AVDMANAGER" list avd || true
          echo "=== avdmanager compact list ==="
          timeout -k 1s 10s "$AVDMANAGER" list avd -c || true
          echo "=== emulator visible avds ==="
          timeout -k 1s 10s "$EMULATOR" -list-avds || true
          echo "=== HOME android AVD files ==="
          timeout -k 1s 5s find "$HOME/.android" -maxdepth 3 -type f -print 2>/dev/null || true
          if [[ -n "${ANDROID_AVD_HOME:-}" ]]; then
            timeout -k 1s 5s find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print 2>/dev/null || true
          fi
          if [[ -n "${ANDROID_USER_HOME:-}" ]]; then
            timeout -k 1s 5s find "$ANDROID_USER_HOME" -maxdepth 3 -type f -print 2>/dev/null || true
          fi
          if [[ -n "${ANDROID_EMULATOR_HOME:-}" ]]; then
            timeout -k 1s 5s find "$ANDROID_EMULATOR_HOME" -maxdepth 3 -type f -print 2>/dev/null || true
          fi
          if [[ -n "${ANDROID_SDK_HOME:-}" ]]; then
            timeout -k 1s 5s find "$ANDROID_SDK_HOME" -maxdepth 3 -type f -print 2>/dev/null || true
          fi
          echo "=== exact AVD file locations ==="
          timeout -k 1s 5s find "$HOME" "$SDK_ROOT" -maxdepth 5 \
            \( -name 'andy-ci-api36.ini' -o -name 'andy-ci-api36.avd' \) \
            -print 2>/dev/null || true
          AVAILABLE_AVDS="$(timeout -k 1s 10s "$AVDMANAGER" list avd -c)"
          if ! grep -qx 'andy-ci-api36' <<< "$AVAILABLE_AVDS"; then
            echo 'AVD_CREATION_POSTCONDITION_FAILED'
            printf '%s\n' "$AVAILABLE_DEVICES"
            printf '%s\n' "$AVAILABLE_AVDS"
            find "$HOME/.android/avd" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi
          EMULATOR_AVDS="$(timeout -k 1s 10s "$EMULATOR" -list-avds)"
          if ! grep -qx 'andy-ci-api36' <<< "$EMULATOR_AVDS"; then
            echo 'AVD_EMULATOR_DISCOVERY_FAILED'
            printf '%s\n' "$EMULATOR_AVDS"
            exit 1
          fi
          if [[ ! -f "$ANDROID_AVD_HOME/andy-ci-api36.ini" || ! -d "$ANDROID_AVD_HOME/andy-ci-api36.avd" ]]; then
            echo 'AVD_FILES_POSTCONDITION_FAILED'
            exit 1
          fi
          "$EMULATOR" \
            -avd andy-ci-api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/andy-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          boot_deadline=$((SECONDS + 240))
          booted=''
          while (( SECONDS < boot_deadline )); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'EMULATOR_EXITED_BEFORE_BOOT'
              exit 1
            fi
            if timeout -k 1s 3s "$ADB" wait-for-device; then
              booted="$(timeout -k 1s 3s "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'EMULATOR_EXITED_BEFORE_BOOT'
              exit 1
            fi
            if [[ "$booted" == '1' ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$booted" != '1' ]]; then
            echo 'EMULATOR_BOOT_TIMEOUT'
            exit 1
          fi

      - name: Run real Android Keystore instrumentation tests
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :data:device-identity:connectedDebugAndroidTest

      - name: Stop emulator
        if: always() && steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -u
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/platform-tools/adb" emu kill || true

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact PR candidate for unprivileged build
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project
        id: android_project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./gradlew && -f ./settings.gradle.kts && -f ./app/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_PROJECT_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_PROJECT_NOT_PRESENT'
          fi

      - name: Detect device identity module
        id: device_identity
        if: steps.android_project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f core/device-identity/build.gradle.kts && -f data/device-identity/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'DEVICE_IDENTITY_MODULE_NOT_PRESENT'
          fi

      - name: Detect human identity modules
        id: human_identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f core/human-identity/build.gradle.kts && \
                -f sdk/client-api/build.gradle.kts && \
                -f integrations/google-identity/build.gradle.kts && \
                -f features/onboarding/build.gradle.kts ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'HUMAN_IDENTITY_MODULES_PRESENT'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'HUMAN_IDENTITY_MODULES_NOT_PRESENT'
          fi

      - name: Install compile SDK and build tools
        if: steps.android_project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Build and test exact candidate
        if: steps.android_project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Run device identity JVM tests
        if: steps.device_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :core:device-identity:test \
            :data:device-identity:testDebugUnitTest

      - name: Run human identity JVM tests
        if: steps.human_identity.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :core:human-identity:test \
            :sdk:client-api:test \
            :integrations:google-identity:testDebugUnitTest \
            :features:onboarding:testDebugUnitTest

      - name: Upload debug APK
        if: success() && steps.android_project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: andy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
